<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabajo Drag and Drop</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
  </head>
  <body>
          <h1>Arrastra las imágenes</h1>

    <div class="contenedor">
      <section class="cajaizda">
        <img
          id="img1"
          src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
          alt="icono estrella amarilla"
          draggable="true"
        />
        <img
          id="img2"
          src="https://cdn-icons-png.flaticon.com/512/1828/1828970.png"
          alt="icono estrella borde"
          draggable="true"
        />
        <img
          id="img3"
          src="https://cdn-icons-png.flaticon.com/512/1828/1828843.png"
          alt="icono cruz"
          draggable="true"
        />
      </section>
      <section class="cajadcha"></section>
    </div>
  </body>
</html>
